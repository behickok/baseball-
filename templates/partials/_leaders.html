<section class="player-table">
  <div class="team-heading">
    <h2>{{ title }}</h2>
    <span class="muted">{{ season }} · top 25 by WAR</span>
  </div>
  <table class="data">
    <thead>
      <tr>{% for _, label in cols %}<th>{{ label }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for key, label in cols %}
          <td {% if key == 'name' %}class="player"{% endif %}>{{ row[key]|fmt }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
